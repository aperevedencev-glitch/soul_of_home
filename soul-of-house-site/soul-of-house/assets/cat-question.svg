<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bodyGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#D98E5C"/>
    </linearGradient>
  </defs>

  <ellipse cx="240" cy="520" rx="140" ry="18" fill="#00000012"/>

  <!-- tail -->
  <path d="M355 380 C 430 370, 445 290, 400 250 C 385 236, 365 245, 372 262 C 400 292, 392 345, 340 355 Z"
        fill="url(#bodyGrad3)"/>

  <!-- body -->
  <ellipse cx="240" cy="400" rx="150" ry="120" fill="url(#bodyGrad3)"/>
  <ellipse cx="240" cy="430" rx="72" ry="86" fill="#FBF3E7"/>

  <!-- paws -->
  <ellipse cx="196" cy="495" rx="26" ry="20" fill="#FBF3E7"/>
  <ellipse cx="284" cy="495" rx="26" ry="20" fill="#FBF3E7"/>

  <!-- paw to chin (thinking) -->
  <path d="M340 340 C 372 320, 380 280, 358 262 C 348 254, 334 260, 336 272 C 350 284, 348 312, 322 328 Z"
        fill="url(#bodyGrad3)"/>
  <ellipse cx="352" cy="264" rx="18" ry="15" fill="#FBF3E7" transform="rotate(20 352 264)"/>

  <!-- head -->
  <circle cx="240" cy="230" r="118" fill="url(#bodyGrad3)"/>

  <!-- ears -->
  <path d="M140 165 L110 60 L205 130 Z" fill="url(#bodyGrad3)"/>
  <path d="M340 165 L370 60 L275 130 Z" fill="url(#bodyGrad3)"/>
  <path d="M150 150 L132 82 L192 128 Z" fill="#F3C9A0"/>
  <path d="M330 150 L348 82 L288 128 Z" fill="#F3C9A0"/>

  <!-- neural pattern spanning both ears -->
  <path d="M140 100 L155 120 L145 138 L162 150" stroke="#F4D35E" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="140" cy="100" r="3.5" fill="#F4D35E"/>
  <circle cx="155" cy="120" r="3.5" fill="#F4D35E"/>
  <circle cx="145" cy="138" r="3.5" fill="#F4D35E"/>
  <circle cx="162" cy="150" r="3.5" fill="#F4D35E"/>

  <!-- face patch -->
  <ellipse cx="240" cy="262" rx="66" ry="52" fill="#FBF3E7"/>

  <!-- eyes looking up-right, curious -->
  <ellipse cx="210" cy="230" rx="9" ry="12" fill="#2B2118"/>
  <ellipse cx="280" cy="230" rx="9" ry="12" fill="#2B2118"/>
  <circle cx="213" cy="225" r="2.6" fill="#fff"/>
  <circle cx="283" cy="225" r="2.6" fill="#fff"/>

  <!-- blush -->
  <ellipse cx="188" cy="256" rx="12" ry="7" fill="#E8905A" opacity="0.35"/>
  <ellipse cx="292" cy="256" rx="12" ry="7" fill="#E8905A" opacity="0.35"/>

  <!-- nose + mouth -->
  <path d="M232 250 L248 250 L240 260 Z" fill="#C97A48"/>
  <path d="M240 260 Q240 268 228 268 M240 260 Q240 268 252 268" stroke="#2B2118" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <path d="M150 250 L192 246 M150 264 L192 260 M330 250 L288 246 M330 264 L288 260"
        stroke="#2B2118" stroke-width="1.6" opacity="0.4" stroke-linecap="round"/>

  <!-- thought bubble with question mark -->
  <g>
    <circle cx="378" cy="120" r="8" fill="#FBF3E7" stroke="#D98E5C" stroke-width="2"/>
    <circle cx="398" cy="90" r="12" fill="#FBF3E7" stroke="#D98E5C" stroke-width="2"/>
    <circle cx="430" cy="55" r="42" fill="#FBF3E7" stroke="#D98E5C" stroke-width="2.5"/>
    <text x="430" y="70" font-family="Georgia, serif" font-size="46" font-weight="700"
          text-anchor="middle" fill="#D98E5C">?</text>
  </g>
</svg>
