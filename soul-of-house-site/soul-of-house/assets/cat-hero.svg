<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#D98E5C"/>
    </linearGradient>
    <linearGradient id="neuroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D35E"/>
      <stop offset="100%" stop-color="#E8905A"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="240" cy="520" rx="140" ry="18" fill="#00000012"/>

  <!-- tail -->
  <path d="M355 380 C 430 370, 445 290, 400 250 C 385 236, 365 245, 372 262 C 400 292, 392 345, 340 355 Z"
        fill="url(#bodyGrad)"/>

  <!-- body -->
  <ellipse cx="240" cy="400" rx="150" ry="120" fill="url(#bodyGrad)"/>

  <!-- chest patch -->
  <ellipse cx="240" cy="430" rx="72" ry="86" fill="#FBF3E7"/>

  <!-- neural core glow on chest -->
  <circle cx="240" cy="410" r="14" fill="url(#neuroGrad)"/>
  <circle cx="240" cy="410" r="22" fill="none" stroke="#F4D35E" stroke-width="2" opacity="0.5"/>
  <path d="M240 396 L240 424 M226 410 L254 410 M230 400 L250 420 M250 400 L230 420"
        stroke="#E8905A" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>

  <!-- front paws -->
  <ellipse cx="196" cy="495" rx="26" ry="20" fill="#FBF3E7"/>
  <ellipse cx="284" cy="495" rx="26" ry="20" fill="#FBF3E7"/>

  <!-- raised paw (greeting) -->
  <path d="M120 360 C 90 330, 85 280, 118 255 C 130 246, 146 254, 142 268 C 122 285, 122 320, 148 345 Z"
        fill="url(#bodyGrad)"/>
  <ellipse cx="112" cy="258" rx="20" ry="16" fill="#FBF3E7" transform="rotate(-25 112 258)"/>

  <!-- head -->
  <circle cx="240" cy="230" r="118" fill="url(#bodyGrad)"/>

  <!-- ears -->
  <path d="M140 165 L110 60 L205 130 Z" fill="url(#bodyGrad)"/>
  <path d="M340 165 L370 60 L275 130 Z" fill="url(#bodyGrad)"/>
  <path d="M150 150 L132 82 L192 128 Z" fill="#F3C9A0"/>
  <path d="M330 150 L348 82 L288 128 Z" fill="#F3C9A0"/>

  <!-- neural pattern along left ear -->
  <path d="M140 100 L155 120 L145 138 L162 150" stroke="#F4D35E" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="140" cy="100" r="3.5" fill="#F4D35E"/>
  <circle cx="155" cy="120" r="3.5" fill="#F4D35E"/>
  <circle cx="145" cy="138" r="3.5" fill="#F4D35E"/>
  <circle cx="162" cy="150" r="3.5" fill="#F4D35E"/>

  <!-- face patch -->
  <ellipse cx="240" cy="262" rx="66" ry="52" fill="#FBF3E7"/>

  <!-- eyes -->
  <ellipse cx="205" cy="232" rx="9" ry="12" fill="#2B2118"/>
  <ellipse cx="275" cy="232" rx="9" ry="12" fill="#2B2118"/>
  <circle cx="208" cy="228" r="2.6" fill="#fff"/>
  <circle cx="278" cy="228" r="2.6" fill="#fff"/>

  <!-- blush -->
  <ellipse cx="188" cy="256" rx="12" ry="7" fill="#E8905A" opacity="0.35"/>
  <ellipse cx="292" cy="256" rx="12" ry="7" fill="#E8905A" opacity="0.35"/>

  <!-- nose + mouth -->
  <path d="M232 250 L248 250 L240 260 Z" fill="#C97A48"/>
  <path d="M240 260 Q240 270 224 272 M240 260 Q240 270 256 272" stroke="#2B2118" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <path d="M150 250 L192 246 M150 264 L192 260 M330 250 L288 246 M330 264 L288 260"
        stroke="#2B2118" stroke-width="1.6" opacity="0.4" stroke-linecap="round"/>

  <!-- tiny house tag on chest -->
  <g transform="translate(240 470)">
    <path d="M-14 6 L-14 -6 L0 -16 L14 -6 L14 6 Z" fill="#B85C38"/>
    <rect x="-4" y="-2" width="8" height="8" fill="#FBF3E7"/>
  </g>
</svg>
