<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bodyGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#D98E5C"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4D35E"/>
      <stop offset="100%" stop-color="#E8905A"/>
    </linearGradient>
  </defs>

  <ellipse cx="240" cy="520" rx="140" ry="18" fill="#00000012"/>

  <!-- tail curled to side -->
  <path d="M348 400 C 410 410, 430 360, 400 320 C 388 306, 368 314, 374 330 C 392 352, 382 385, 330 385 Z"
        fill="url(#bodyGrad2)"/>

  <!-- body -->
  <ellipse cx="240" cy="400" rx="150" ry="120" fill="url(#bodyGrad2)"/>
  <ellipse cx="240" cy="430" rx="72" ry="86" fill="#FBF3E7"/>

  <!-- both paws forward, holding heart -->
  <ellipse cx="196" cy="480" rx="30" ry="22" fill="#FBF3E7" transform="rotate(18 196 480)"/>
  <ellipse cx="284" cy="480" rx="30" ry="22" fill="#FBF3E7" transform="rotate(-18 284 480)"/>

  <!-- heart -->
  <g transform="translate(240 452)">
    <path d="M0 20 C -34 -6, -30 -44, -2 -34 C 4 -32, 4 -32, 2 -34 C 30 -44, 34 -6, 0 20 Z"
          fill="url(#heartGrad)" stroke="#B85C38" stroke-width="2"/>
    <path d="M-14 -18 L-6 -10 L6 -22" stroke="#FBF3E7" stroke-width="2.4" fill="none"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>

  <!-- head -->
  <circle cx="240" cy="230" r="118" fill="url(#bodyGrad2)"/>

  <!-- ears -->
  <path d="M140 165 L110 60 L205 130 Z" fill="url(#bodyGrad2)"/>
  <path d="M340 165 L370 60 L275 130 Z" fill="url(#bodyGrad2)"/>
  <path d="M150 150 L132 82 L192 128 Z" fill="#F3C9A0"/>
  <path d="M330 150 L348 82 L288 128 Z" fill="#F3C9A0"/>

  <!-- neural pattern along right ear this time -->
  <path d="M340 100 L325 120 L335 138 L318 150" stroke="#F4D35E" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="340" cy="100" r="3.5" fill="#F4D35E"/>
  <circle cx="325" cy="120" r="3.5" fill="#F4D35E"/>
  <circle cx="335" cy="138" r="3.5" fill="#F4D35E"/>
  <circle cx="318" cy="150" r="3.5" fill="#F4D35E"/>

  <!-- face patch -->
  <ellipse cx="240" cy="262" rx="66" ry="52" fill="#FBF3E7"/>

  <!-- eyes: happy closed-arc -->
  <path d="M194 228 Q205 216 216 228" stroke="#2B2118" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M264 228 Q275 216 286 228" stroke="#2B2118" stroke-width="3.4" fill="none" stroke-linecap="round"/>

  <!-- blush -->
  <ellipse cx="188" cy="256" rx="13" ry="8" fill="#E8905A" opacity="0.4"/>
  <ellipse cx="292" cy="256" rx="13" ry="8" fill="#E8905A" opacity="0.4"/>

  <!-- nose + mouth -->
  <path d="M232 250 L248 250 L240 260 Z" fill="#C97A48"/>
  <path d="M240 260 Q240 270 224 272 M240 260 Q240 270 256 272" stroke="#2B2118" stroke-width="2.4"
        fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <path d="M150 250 L192 246 M150 264 L192 260 M330 250 L288 246 M330 264 L288 260"
        stroke="#2B2118" stroke-width="1.6" opacity="0.4" stroke-linecap="round"/>
</svg>
